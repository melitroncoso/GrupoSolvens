<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grupo Solvens - Evidencia de Visita</title>
    <link rel="icon" href="../IMG/logo2.jpg" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/filtros.css">
    <link rel="stylesheet" href="style/vista_fotos.css">
    <link rel="stylesheet" href="style/inicio.css">
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>

<body>

    <header class="header">
        <div class="header-left">
            <a href="inicioCliente.html" class="btn-volver" title="Volver al inicio">
                <i class="fas fa-arrow-left"></i>
            </a>
            <button id="btnExportarPPTX" class="btn-pptx btn-toggle-fotos" title="Generar reporte PowerPoint">
                <i class="fas fa-file-powerpoint"></i>
                <span>Exportar PPTX</span>
            </button>
        </div>
        <div class="header-center">
            <img src="../IMG/logo.png" alt="Logo Grupo Solvens" class="logo-nav">
        </div>
        <div class="header-right header-right-flex">
            <a href="login.html" class="btn-salir">Cerrar Sesión</a>
            <button class="btn-toggle-sidebar" id="btnToggleSidebar">
                <i class="fas fa-filter"></i>
                <span>Filtros</span>
            </button>
        </div>
    </header>

    <main class="contenido">
        <h1>Evidencia <span>Fotográfica</span></h1>
        <p class="page-subtitulo">Registro visual de visitas aprobadas</p>

        <div class="contenedor-layout">

            <!-- ══ SIDEBAR COMPACTO ══ -->
            <aside class="sidebar-filtros" id="sidebarFiltros">

                <div class="sidebar-header">
                    <h2 class="titulo-filtros">Filtros</h2>
                    <button class="btn-cerrar-sidebar" id="btnCerrarSidebar">
                        <i class="fas fa-times"></i>
                    </button>
                </div>

                <!-- Tags de filtros activos -->
                <div class="sf-tags-activos" id="sfTagsActivos"></div>

                <!-- Fechas en línea -->
                <div class="sf-fechas-row">
                    <div class="sf-fecha-bloque">
                        <label class="sf-fecha-label">Desde</label>
                        <input type="date" class="sf-fecha-input" id="fechaDesde">
                    </div>
                    <div class="sf-fecha-bloque">
                        <label class="sf-fecha-label">Hasta</label>
                        <input type="date" class="sf-fecha-input" id="fechaHasta">
                    </div>
                </div>

                <!-- Chips grilla 2x3 -->
                <div class="sf-chips-grid" id="sfChipsGrid"></div>

                <!-- Dropdown flotante -->
                <div class="sf-dropdown" id="sfDropdown" style="display:none;">
                    <div class="sf-dropdown-inner" id="sfDropdownInner"></div>
                </div>

                <!-- Botones -->
                <div class="sf-botones">
                    <button id="btnAplicarFiltros" class="btn-aplicar-filtros">Aplicar</button>
                    <button id="btnLimpiarFiltros" class="btn-limpiar-filtros">Limpiar</button>
                </div>

            </aside>
            <!-- overlay cierra dropdown -->
            <div class="sf-overlay" id="sfOverlay"></div>

            <div id="contenedorVisitas" class="contenedor-visitas-full"></div>
        </div>
    </main>

    <!-- Navegación entre visitas -->
    <div class="nav-container" id="navVisitas" style="display: none;">
        <button class="btn-nav-visita" id="prevVisita" title="Visita Anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="btn-nav-visita" id="nextVisita" title="Siguiente Visita">
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>

    <footer class="footer-contacto">
        <p><i class="fa-solid fa-envelope"></i> <a href="mailto:NRossi@gruposolvens.com.ar">NRossi@gruposolvens.com.ar</a> | <i class="fa-solid fa-phone"></i> +54 11 6142-0293</p>
    </footer>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-prev" id="lightbox-prev" title="Imagen anterior">
            <i class="fas fa-chevron-left"></i>
        </button>
        <button class="lightbox-next" id="lightbox-next" title="Siguiente imagen">
            <i class="fas fa-chevron-right"></i>
        </button>
        <div class="lightbox-controls">
            <button class="btn-control" id="lightbox-download" title="Descargar">
                <i class="fas fa-download"></i>
            </button>
            <button class="btn-control" id="lightbox-close" title="Cerrar">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <img class="lightbox-img" id="lightbox-img" src="" alt="">
        <div class="lightbox-info">
            <div id="lightbox-info-content" style="display:contents;"></div>
            <button class="btn-control-inline" id="lightbox-rotate" title="Rotar">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </div>

    <script>
        const URL_BASE = '/api';

        let visitasData = [];
        let filteredVisitas = [];
        let visitaIndex = 0;

        // ══════════════════════════════════════════════
        // SIDEBAR COMPACTO — configuración de chips
        // ══════════════════════════════════════════════
        const SF_FILTROS = [
            { id: 'cadena',   label: 'Cadena'   },
            { id: 'sucursal', label: 'Sucursal' },
            { id: 'zona',     label: 'Zona'     },
            { id: 'subzona',  label: 'Subzona'  },
            { id: 'canal',    label: 'Canal'    },
        ];

        const sfSeleccionados = {};
        SF_FILTROS.forEach(f => sfSeleccionados[f.id] = '');

        let sfChipActivo = null;

        function sfRenderChips() {
            const grid = document.getElementById('sfChipsGrid');
            if (!grid) return;
            grid.innerHTML = '';
            SF_FILTROS.forEach(f => {
                const chip = document.createElement('div');
                chip.className = 'sf-chip' + (sfSeleccionados[f.id] ? ' activo' : '');
                chip.dataset.id = f.id;
                chip.innerHTML = `
                    <span class="sf-chip-label">${f.label}</span>
                    <span class="sf-chip-valor">${sfSeleccionados[f.id] || 'Todas'}</span>
                    <span class="sf-chip-caret">▼</span>`;
                chip.addEventListener('click', (e) => sfAbrirDropdown(e, f));
                grid.appendChild(chip);
            });
        }

        function sfRenderTags() {
            const cont = document.getElementById('sfTagsActivos');
            if (!cont) return;
            cont.innerHTML = '';
            SF_FILTROS.forEach(f => {
                if (!sfSeleccionados[f.id]) return;
                const tag = document.createElement('div');
                tag.className = 'sf-tag';
                tag.innerHTML = `${f.label}: <strong>${sfSeleccionados[f.id]}</strong><span class="sf-tag-x">✕</span>`;
                tag.addEventListener('click', () => {
                    sfSeleccionados[f.id] = '';
                    sfRenderChips();
                    sfRenderTags();
                });
                cont.appendChild(tag);
            });
        }

        function sfAbrirDropdown(e, filtro) {
            e.stopPropagation();

            if (sfChipActivo === filtro.id) {
                sfCerrarDropdown();
                return;
            }
            sfChipActivo = filtro.id;

            const opciones = [...new Set(visitasData.map(v => v[filtro.id]))]
                .filter(Boolean)
                .sort((a, b) => a.localeCompare(b, 'es'));

            const dropdown = document.getElementById('sfDropdown');
            const inner    = document.getElementById('sfDropdownInner');

            inner.innerHTML = `<div class="sf-dropdown-item${sfSeleccionados[filtro.id] === '' ? ' seleccionado' : ''}" data-val="">Todas</div>`;
            opciones.forEach(op => {
                const item = document.createElement('div');
                item.className = 'sf-dropdown-item' + (sfSeleccionados[filtro.id] === op ? ' seleccionado' : '');
                item.dataset.val = op;
                item.textContent = op;
                inner.appendChild(item);
            });

            const sidebar     = document.getElementById('sidebarFiltros');
            const chipEl      = e.currentTarget;
            const chipRect    = chipEl.getBoundingClientRect();
            const sidebarRect = sidebar.getBoundingClientRect();

            dropdown.style.top   = (chipRect.bottom - sidebarRect.top + sidebar.scrollTop + 4) + 'px';
            dropdown.style.left  = (chipRect.left - sidebarRect.left) + 'px';
            dropdown.style.width = chipEl.offsetWidth + 'px';
            dropdown.style.display = 'block';

            sidebar.style.position = 'relative';
            if (!sidebar.contains(dropdown)) sidebar.appendChild(dropdown);

            document.getElementById('sfOverlay').classList.add('activo');

            inner.querySelectorAll('.sf-dropdown-item').forEach(item => {
                item.addEventListener('click', (ev) => {
                    ev.stopPropagation();
                    sfSeleccionados[filtro.id] = item.dataset.val;
                    sfCerrarDropdown();
                    sfRenderChips();
                    sfRenderTags();
                });
            });
        }

        function sfCerrarDropdown() {
            sfChipActivo = null;
            const dd = document.getElementById('sfDropdown');
            if (dd) dd.style.display = 'none';
            document.getElementById('sfOverlay').classList.remove('activo');
        }

        document.getElementById('sfOverlay').addEventListener('click', sfCerrarDropdown);

        // ══════════════════════════════════════════════
        // CARGA Y RENDER DE VISITAS
        // ══════════════════════════════════════════════
        async function cargarVisitasCliente() {
            const idCliente = sessionStorage.getItem('id_usuario');
            const tipo = Number(sessionStorage.getItem('tipoUsuario'));
            if (tipo !== 2 || !idCliente) {
                window.location.href = 'login.html';
                return;
            }
            const res = await fetch(`${URL_BASE}/imagenes-aprobadas-cliente?id_cliente=${idCliente}`);
            if (!res.ok) {
                document.getElementById('contenedorVisitas').innerHTML = '<p>Error al obtener las imágenes.</p>';
                return;
            }
            visitasData = await res.json();
            visitasData.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            if (visitasData.length === 0) {
                document.getElementById('contenedorVisitas').innerHTML = '<p>No hay imágenes aprobadas.</p>';
                return;
            }
            sfRenderChips();
            sfRenderTags();
            applyFilters();
        }

        function renderVisita(idx) {
            const v = filteredVisitas[idx];
            const cont = document.getElementById('contenedorVisitas');

            const imgsHtml = v.imagenes.map((img, i) => `
                <div class="foto-card" onclick="openLightbox(${i})">
                    <div class="foto-wrapper">
                        <img src="${img.ruta}" alt="Foto ${i + 1}" data-rotation="0" class="img-preview">
                    </div>
                    <button class="btn-rotar-gallery" onclick="rotarImagenGaleria(this, event)" title="Rotar vista">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>`).join('');

            cont.innerHTML = `
                <div class="visita-seccion">
                    <div class="visita-header">
                        <h1>${v.cadena}</h1>
                        <div class="sub">
                            <i class="fas fa-map-marker-alt"></i> ${v.sucursal} - ${v.localidad} |
                            <i class="fas fa-calendar-alt"></i> ${new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' })}
                        </div>
                    </div>
                    <div class="galeria-grid">${imgsHtml}</div>
                </div>`;

            const nav = document.getElementById('navVisitas');
            if (nav) nav.style.display = filteredVisitas.length > 1 ? 'flex' : 'none';
        }

        function rotarImagenGaleria(btn, e) {
            e.stopPropagation();
            const img = btn.parentElement.querySelector('img');
            let rot = (parseInt(img.getAttribute('data-rotation')) + 90) % 360;
            img.setAttribute('data-rotation', rot);
            img.style.transform = `rotate(${rot}deg) ${(rot % 180 !== 0) ? 'scale(0.8)' : ''}`;
        }

        function applyFilters() {
            const fDesde    = document.getElementById('fechaDesde').value;
            const fHasta    = document.getElementById('fechaHasta').value;
            const fCadena   = sfSeleccionados['cadena']   || '';
            const fSucursal = sfSeleccionados['sucursal'] || '';
            const fZona     = sfSeleccionados['zona']     || '';
            const fSubzona  = sfSeleccionados['subzona']  || '';
            const fCanal    = sfSeleccionados['canal']    || '';

            filteredVisitas = visitasData.filter(v => {
                if (fDesde) {
                    const vDate  = new Date(v.fecha).setHours(0,0,0,0);
                    if (vDate < new Date(fDesde).setHours(0,0,0,0)) return false;
                }
                if (fHasta) {
                    const vDate  = new Date(v.fecha).setHours(0,0,0,0);
                    if (vDate > new Date(fHasta).setHours(0,0,0,0)) return false;
                }
                if (fCadena   && v.cadena    !== fCadena)   return false;
                if (fSucursal && v.sucursal  !== fSucursal) return false;
                if (fZona     && v.zona      !== fZona)     return false;
                if (fSubzona  && v.subzona   !== fSubzona)  return false;
                if (fCanal    && v.canal     !== fCanal)    return false;
                return true;
            });

            visitaIndex = 0;
            const cont = document.getElementById('contenedorVisitas');
            if (filteredVisitas.length === 0) {
                cont.innerHTML = '<p style="color:#aaa;padding:40px 0;text-align:center;">No hay visitas que coincidan con los filtros.</p>';
                const nav = document.getElementById('navVisitas');
                if (nav) nav.style.display = 'none';
                return;
            }
            renderVisita(visitaIndex);
        }

        function clearFilters() {
            SF_FILTROS.forEach(f => sfSeleccionados[f.id] = '');
            document.getElementById('fechaDesde').value = '';
            document.getElementById('fechaHasta').value = '';
            sfRenderChips();
            sfRenderTags();
            applyFilters();
        }

        document.getElementById('btnAplicarFiltros').addEventListener('click', () => {
            sfCerrarDropdown();
            applyFilters();
            document.getElementById('sidebarFiltros').classList.remove('activo');
        });

        document.getElementById('btnLimpiarFiltros').addEventListener('click', clearFilters);

        // ══════════════════════════════════════════════
        // LIGHTBOX
        // ══════════════════════════════════════════════
        const lightbox   = document.getElementById('lightbox');
        const lbImg      = document.getElementById('lightbox-img');
        const lbDownload = document.getElementById('lightbox-download');
        const lbRotate   = document.getElementById('lightbox-rotate');
        let currentImg   = 0;

        function openLightbox(index) {
            currentImg = index;
            const previews  = document.querySelectorAll('.img-preview');
            const sourceImg = previews[index];
            lbImg.src = sourceImg.src;
            const rot   = sourceImg.getAttribute('data-rotation') || 0;
            const scale = (rot % 180 !== 0) ? 0.75 : 1;
            lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;
            lbImg.setAttribute('data-rotation', rot);
            updateLightboxInfo();
            lightbox.classList.add('activo');
        }

        function updateLightboxInfo() {
            const v = filteredVisitas[visitaIndex];
            const contentEl = document.getElementById('lightbox-info-content');
            if (v && contentEl) {
                contentEl.innerHTML = `
                    <span><i class="fas fa-building"></i> ${v.cadena}</span>
                    <span><i class="fas fa-map-marker-alt"></i> ${v.sucursal}</span>
                    <span><i class="fas fa-calendar-alt"></i> ${new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' })}</span>`;
            }
        }

        lbRotate.onclick = (e) => {
            e.stopPropagation();
            let rot = (parseInt(lbImg.getAttribute('data-rotation') || 0) + 90) % 360;
            lbImg.setAttribute('data-rotation', rot);
            const scale = (rot % 180 !== 0) ? 0.75 : 1;
            lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;
            const previews = document.querySelectorAll('.img-preview');
            if (previews[currentImg]) {
                previews[currentImg].setAttribute('data-rotation', rot);
                previews[currentImg].style.transform = `rotate(${rot}deg) ${(rot % 180 !== 0) ? 'scale(0.8)' : ''}`;
            }
        };

        function changeImage(delta) {
            const v = filteredVisitas[visitaIndex];
            if (!v || !v.imagenes) return;
            if (delta > 0 && currentImg === v.imagenes.length - 1) {
                visitaIndex = (visitaIndex + 1) % filteredVisitas.length;
                renderVisita(visitaIndex);
                currentImg = 0;
            } else if (delta < 0 && currentImg === 0) {
                visitaIndex = (visitaIndex - 1 + filteredVisitas.length) % filteredVisitas.length;
                renderVisita(visitaIndex);
                currentImg = filteredVisitas[visitaIndex].imagenes.length - 1;
            } else {
                currentImg = (currentImg + delta + v.imagenes.length) % v.imagenes.length;
            }
            setTimeout(() => {
                const previews  = document.querySelectorAll('.img-preview');
                const sourceImg = previews[currentImg];
                if (!sourceImg) return;
                lbImg.src = sourceImg.src;
                const rot   = parseInt(sourceImg.getAttribute('data-rotation') || 0);
                lbImg.setAttribute('data-rotation', rot);
                const scale = (rot % 180 !== 0) ? 0.75 : 1;
                lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;
                updateLightboxInfo();
            }, 0);
        }

        document.getElementById('lightbox-prev').onclick = (e) => { e.stopPropagation(); changeImage(-1); };
        document.getElementById('lightbox-next').onclick = (e) => { e.stopPropagation(); changeImage(1); };

        function closeLightbox() { lightbox.classList.remove('activo'); }
        document.getElementById('lightbox-close').onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };

        if (lbDownload) {
            lbDownload.onclick = (e) => {
                e.stopPropagation();
                const a = document.createElement('a');
                a.href = lbImg.src;
                a.download = 'foto_solvens.jpg';
                a.click();
            };
        }

        document.getElementById('prevVisita').onclick = () => {
            visitaIndex = (visitaIndex - 1 + filteredVisitas.length) % filteredVisitas.length;
            renderVisita(visitaIndex);
        };
        document.getElementById('nextVisita').onclick = () => {
            visitaIndex = (visitaIndex + 1) % filteredVisitas.length;
            renderVisita(visitaIndex);
        };

        // ══════════════════════════════════════════════
        // EXPORTAR PPTX
        // ══════════════════════════════════════════════
        async function imgUrlToBase64(url) {
            try {
                let fetchUrl = url;
                if (url.startsWith('http')) {
                    fetchUrl = `/api/proxy-imagen?url=${encodeURIComponent(url)}`;
                }
                const res = await fetch(fetchUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const blob = await res.blob();
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result);
                    reader.onerror  = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                console.error('Error cargando imagen:', err);
                return null;
            }
        }

        async function generarReportePPTX() {
            const btn = document.getElementById('btnExportarPPTX');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Generando...</span>';
            btn.disabled = true;

            try {
                const ultimasVisitas = filteredVisitas;
                if (!ultimasVisitas || ultimasVisitas.length === 0) {
                    alert('No hay visitas aprobadas para exportar con los filtros actuales.');
                    return;
                }

                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                const slidePortada = pptx.addSlide();
                slidePortada.bkgd = { color: 'F5F5F5' };
                slidePortada.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.6, fill: { color: 'DC2626' } });

                const logoUrl = '/IMG/logo.png';
                const logoB64 = await imgUrlToBase64(logoUrl);
                let headerLogoW, headerLogoH;

                if (logoB64) {
                    const imgObj = new Image();
                    await new Promise(res => { imgObj.onload = res; imgObj.src = logoUrl; });
                    const ratio = imgObj.width / imgObj.height;
                    let coverLogoW = 3.5;
                    let coverLogoH = coverLogoW / ratio;
                    if (coverLogoH > 1.8) { coverLogoH = 1.8; coverLogoW = coverLogoH * ratio; }
                    slidePortada.addImage({ data: logoB64, x: (10 - coverLogoW) / 2, y: 1.0, w: coverLogoW, h: coverLogoH, sizing: { type: 'contain', w: coverLogoW, h: coverLogoH } });
                    headerLogoH = 0.45;
                    headerLogoW = headerLogoH * ratio;
                    if (headerLogoW > 1.8) { headerLogoW = 1.8; headerLogoH = headerLogoW / ratio; }
                }

                slidePortada.addText('Reporte Fotográfico de Visitas', { x: 0, y: 3.2, w: '100%', h: 0.8, fontSize: 32, color: '8B0000', bold: true, align: 'center', fontFace: 'Arial' });
                slidePortada.addText(`Exportado el: ${new Date().toLocaleDateString('es-AR')}`, { x: 0, y: 4.8, w: '100%', h: 0.4, fontSize: 12, color: '666666', align: 'center' });

                for (const v of ultimasVisitas) {
                    // Hasta 5 fotos en una sola slide.
                    // Si hubiera más de 5 (por futuras ampliaciones), se corta en grupos de 5.
                    let imageChunks = [];
                    for (let k = 0; k < v.imagenes.length; k += 5) {
                        imageChunks.push(v.imagenes.slice(k, k + 5));
                    }

                    for (let cIdx = 0; cIdx < imageChunks.length; cIdx++) {
                        const imgs  = imageChunks[cIdx];
                        const count = imgs.length;
                        const slide = pptx.addSlide();
                        slide.bkgd  = { color: 'F9F9F9' };
                        slide.addShape(pptx.ShapeType.rect, { x: 0, y: 0, w: 10, h: 0.6, fill: { color: 'DC2626' } });

                        if (logoB64 && headerLogoW) {
                            slide.addImage({ data: logoB64, x: 0.2, y: (0.6 - headerLogoH) / 2, w: headerLogoW, h: headerLogoH, sizing: { type: 'contain', w: headerLogoW, h: headerLogoH } });
                        }

                        const fechaStr = new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' });
                        slide.addText(`${v.cadena} | ${fechaStr}${imageChunks.length > 1 ? ` (Parte ${cIdx + 1})` : ''}`, { x: 1.5, y: 0.05, w: 8.3, h: 0.5, fontSize: 12, color: 'FFFFFF', align: 'right', valign: 'middle', bold: true });
                        slide.addText(`${v.sucursal} - ${v.localidad}`, { x: 0.5, y: 0.7, w: 9, h: 0.4, fontSize: 20, color: 'DC2626', bold: true });

                        // Layout dinámico según cantidad de fotos:
                        // 1 foto  → centrada grande
                        // 2 fotos → 2 columnas centradas
                        // 3 fotos → 3 columnas
                        // 4 fotos → fila 2+2 (dos filas)
                        // 5 fotos → fila 3 arriba + 2 abajo centradas
                        const areaX = 0.5, areaY = 1.25, areaW = 9;

                        if (count <= 3) {
                            // Una sola fila
                            const areaH = 4.2;
                            const gutter = 0.25;
                            let cW = (areaW - (count - 1) * gutter) / count;
                            let startX = areaX;
                            if (count === 1) { cW = 5; startX = areaX + (areaW - cW) / 2; }
                            else if (count === 2) { cW = 4; startX = areaX + (areaW - (cW * 2 + gutter)) / 2; }

                            for (let i = 0; i < count; i++) {
                                const imgB64 = await imgUrlToBase64(imgs[i].ruta);
                                if (imgB64) slide.addImage({ data: imgB64, x: startX + i * (cW + gutter), y: areaY, sizing: { type: 'contain', w: cW, h: areaH } });
                            }

                        } else if (count === 4) {
                            // 2 filas × 2 columnas
                            const cW = 4.3, cH = 1.95, gX = 0.4, gY = 0.25;
                            const startX = areaX + (areaW - (cW * 2 + gX)) / 2;
                            const rows = [[0,1],[2,3]];
                            rows.forEach((row, rIdx) => {
                                row.forEach(async (imgIdx, cIdx2) => {
                                    const imgB64 = await imgUrlToBase64(imgs[imgIdx].ruta);
                                    if (imgB64) slide.addImage({ data: imgB64, x: startX + cIdx2 * (cW + gX), y: areaY + rIdx * (cH + gY), sizing: { type: 'contain', w: cW, h: cH } });
                                });
                            });
                            // Esperar todas las promesas
                            await Promise.all([0,1,2,3].map(async (imgIdx) => {
                                const rIdx  = Math.floor(imgIdx / 2);
                                const cIdx2 = imgIdx % 2;
                                const imgB64 = await imgUrlToBase64(imgs[imgIdx].ruta);
                                if (imgB64) slide.addImage({ data: imgB64, x: startX + cIdx2 * (cW + gX), y: areaY + rIdx * (cH + gY), sizing: { type: 'contain', w: cW, h: cH } });
                            }));

                        } else {
                            // 5 fotos → fila de 3 arriba + fila de 2 abajo centrada
                            const cH = 1.85, gX = 0.2, gY = 0.25;
                            // Fila 1: 3 fotos
                            const cW3 = (areaW - 2 * gX) / 3;
                            for (let i = 0; i < 3; i++) {
                                const imgB64 = await imgUrlToBase64(imgs[i].ruta);
                                if (imgB64) slide.addImage({ data: imgB64, x: areaX + i * (cW3 + gX), y: areaY, sizing: { type: 'contain', w: cW3, h: cH } });
                            }
                            // Fila 2: 2 fotos centradas
                            const cW2 = (areaW - gX) / 2;
                            const startX2 = areaX + (areaW - (cW2 * 2 + gX)) / 2;
                            for (let i = 0; i < 2; i++) {
                                const imgB64 = await imgUrlToBase64(imgs[3 + i].ruta);
                                if (imgB64) slide.addImage({ data: imgB64, x: startX2 + i * (cW2 + gX), y: areaY + cH + gY, sizing: { type: 'contain', w: cW2, h: cH } });
                            }
                        }
                    }
                }

                await pptx.writeFile({ fileName: `Reporte_Fotografico_Visitas_${new Date().toISOString().slice(0,10)}.pptx` });

            } catch (err) {
                console.error('Error al generar PPTX:', err);
                alert('Hubo un error al generar el PowerPoint.');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled  = false;
            }
        }

        document.getElementById('btnExportarPPTX').onclick = generarReportePPTX;

        document.addEventListener('DOMContentLoaded', cargarVisitasCliente);
    </script>

    <script src="js/filtros.js"></script>
</body>
