    <script>
        const URL_BASE = '/api';

        function formatUbicacion(v) {
            const loc = (v.localidad && v.localidad !== '-') ? v.localidad.trim() : '';
            const zon = (v.zona && v.zona !== '-') ? v.zona.trim() : '';
            if (loc && zon) return `${loc}, ${zon}`;
            return loc || zon || '';
        }

        let visitasData = [];
        let filteredVisitas = [];
        let visitaIndex = 0;
        let imgs = [];

        async function cargarVisitasCliente() {
            const idCliente = sessionStorage.getItem('id_usuario');
            const tipo = Number(sessionStorage.getItem('tipoUsuario'));
            if (tipo !== 2 || !idCliente) {
                window.location.href = 'login.html';
                return;
            }
            const res = await fetch(`${URL_BASE}/imagenes-aprobadas-cliente?id_cliente=${idCliente}`);
            if (!res.ok) {
                document.getElementById('contenedorVisitas').innerHTML = '<p>Error al obtener las imágenes.</p>';
                return;
            }
            visitasData = await res.json();
            const nombreCliente = sessionStorage.getItem('nombreUsuario') || '';
            window._esAGD = nombreCliente.toUpperCase().includes('AGD');
            visitasData.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
            if (visitasData.length === 0) {
                document.getElementById('contenedorVisitas').innerHTML = '<p>No hay imágenes aprobadas.</p>';
                return;
            }
            populateFilters();
            clearFilters();
        }

        function renderVisita(idx) {
            const v = filteredVisitas[idx];
            const cont = document.getElementById('contenedorVisitas');

            const imgsHtml = v.imagenes.map((img, i) => {
                return `
                <div class="foto-card" onclick="openLightbox(${i})">
                    <div class="foto-wrapper">
                        <img src="${img.ruta}" alt="Foto ${i + 1}" data-rotation="0" class="img-preview">
                    </div>
                    <button class="btn-rotar-gallery" onclick="rotarImagenGaleria(this, event)" title="Rotar vista">
                        <i class="fas fa-sync-alt"></i>
                    </button>
                </div>`;
            }).join('');

            cont.innerHTML = `
                <div class="visita-seccion">
                    <div class="visita-header">
                        <h1>${v.cadena}</h1>
                        <div class="sub">
                            <i class="fas fa-map-marker-alt"></i> ${v.sucursal} - ${formatUbicacion(v)} | 
                            <i class="fas fa-calendar-alt"></i> ${new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' })}
                            ${window._esAGD && v.repositor ? ' | <i class="fas fa-user"></i> ' + v.repositor : ''}
                        </div>
                    </div>
                    <div class="galeria-grid">
                        ${imgsHtml}
                    </div>
                </div>`;

            const nav = document.getElementById('navVisitas');
            if (nav) nav.style.display = filteredVisitas.length > 1 ? 'flex' : 'none';
        }

        function rotarImagenGaleria(btn, e) {
            e.stopPropagation();
            const img = btn.parentElement.querySelector('img');
            let rot = (parseInt(img.getAttribute('data-rotation')) + 90) % 360;
            img.setAttribute('data-rotation', rot);
            img.style.transform = `rotate(${rot}deg) ${(rot % 180 !== 0) ? 'scale(0.8)' : ''}`;
        }

        function populateFilters() {
            const makeOptions = (items) => {
                const uniq = [...new Set(items)].filter(Boolean).sort((a,b) => a.localeCompare(b, 'es'));
                return uniq.map(x => `<option value="${x}">${x}</option>`).join('');
            };
            const llenar = (id, opciones, titulo) => {
                const sel = document.getElementById(id);
                sel.innerHTML = `<option value="">${titulo}</option>` + opciones;
            };
            llenar('filtroCadena', makeOptions(visitasData.map(v => v.cadena)), 'Cadena (todas)');
            llenar('filtroSucursal', makeOptions(visitasData.map(v => v.sucursal)), 'Sucursal (todas)');
            llenar('filtroZona', makeOptions(visitasData.map(v => v.zona)), 'Zona (todas)');
            llenar('filtroSubzona', makeOptions(visitasData.map(v => v.subzona)), 'Subzona (todas)');
            llenar('filtroCanal', makeOptions(visitasData.map(v => v.canal)), 'Canal (todos)');
        }
        function applyFilters() {
            const fDesde = document.getElementById('fechaDesde').value;
            const fHasta = document.getElementById('fechaHasta').value;
            const fCad = document.getElementById('filtroCadena').value;
            const fSuc = document.getElementById('filtroSucursal').value;
            const fZona = document.getElementById('filtroZona').value;
            const fSubzona = document.getElementById('filtroSubzona').value;
            const fCanal = document.getElementById('filtroCanal').value;
            filteredVisitas = visitasData.filter(v => {
                if (fDesde) {
                    const vDate = new Date(v.fecha).setHours(0, 0, 0, 0);
                    const dDesde = new Date(fDesde).setHours(0, 0, 0, 0);
                    if (vDate < dDesde) return false;
                }
                if (fHasta) {
                    const vDate = new Date(v.fecha).setHours(0, 0, 0, 0);
                    const dHasta = new Date(fHasta).setHours(0, 0, 0, 0);
                    if (vDate > dHasta) return false;
                }
                if (fCad && v.cadena !== fCad) return false;
                if (fSuc && v.sucursal !== fSuc) return false;
                if (fZona && v.zona !== fZona) return false;
                if (fSubzona && v.subzona !== fSubzona) return false;
                if (fCanal && v.canal !== fCanal) return false;
                return true;
            });
            visitaIndex = 0;
            if (filteredVisitas.length === 0) {
                document.getElementById('contenedorVisitas').innerHTML = '<p>No hay visitas que coincidan.</p>';
                document.getElementById('prevVisita').style.display = 'none';
                document.getElementById('nextVisita').style.display = 'none';
                return;
            }
            renderVisita(visitaIndex);
        }
        function clearFilters() {
            ['fechaDesde', 'fechaHasta', 'filtroCadena', 'filtroSucursal', 'filtroZona', 'filtroSubzona', 'filtroCanal']
                .forEach(id => document.getElementById(id).value = '');
            applyFilters();
        }

        // lightbox setup


        // lightbox setup

        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lightbox-img');
        const lbDownload = document.getElementById('lightbox-download');
        const lbRotate = document.getElementById('lightbox-rotate');
        let currentImg = 0;

        function openLightbox(index) {
            currentImg = index;
            const previews = document.querySelectorAll('.img-preview');
            const sourceImg = previews[index];

            lbImg.src = sourceImg.src;

            // Sincronizar rotación
            const rot = sourceImg.getAttribute('data-rotation') || 0;
            const scale = (rot % 180 !== 0) ? 0.75 : 1;
            lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;
            lbImg.setAttribute('data-rotation', rot);

            updateLightboxInfo();
            lightbox.classList.add('activo');
        }

        function updateLightboxInfo() {
            const v = filteredVisitas[visitaIndex];
            const contentEl = document.getElementById('lightbox-info-content');
            if (v && contentEl) {
                contentEl.innerHTML = `
                    <span><i class="fas fa-building"></i> ${v.cadena}</span>
                    <span><i class="fas fa-map-marker-alt"></i> ${v.sucursal} - ${formatUbicacion(v)}</span>
                    <span><i class="fas fa-calendar-alt"></i> ${new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' })}</span>
                    ${window._esAGD && v.repositor ? `<span><i class="fas fa-user"></i> ${v.repositor}</span>` : ''}
                `;
            }
        }

        lbRotate.onclick = (e) => {
            e.stopPropagation();
            let rot = (parseInt(lbImg.getAttribute('data-rotation') || 0) + 90) % 360;
            lbImg.setAttribute('data-rotation', rot);
            const scale = (rot % 180 !== 0) ? 0.75 : 1;
            lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;

            // Sincronizar de vuelta a la galería
            const previews = document.querySelectorAll('.img-preview');
            if (previews[currentImg]) {
                previews[currentImg].setAttribute('data-rotation', rot);
                previews[currentImg].style.transform = `rotate(${rot}deg) ${(rot % 180 !== 0) ? 'scale(0.8)' : ''}`;
            }
        };

        function changeImage(delta) {
            const v = filteredVisitas[visitaIndex];
            if (!v || !v.imagenes) return;

            // Lógica para saltar entre visitas si llegamos al final/inicio
            if (delta > 0 && currentImg === v.imagenes.length - 1) {
                visitaIndex = (visitaIndex + 1) % filteredVisitas.length;
                renderVisita(visitaIndex);
                currentImg = 0;
            } else if (delta < 0 && currentImg === 0) {
                visitaIndex = (visitaIndex - 1 + filteredVisitas.length) % filteredVisitas.length;
                renderVisita(visitaIndex);
                currentImg = filteredVisitas[visitaIndex].imagenes.length - 1;
            } else {
                currentImg = (currentImg + delta + v.imagenes.length) % v.imagenes.length;
            }

            // Usamos setTimeout para asegurar que el renderVisita terminó de inyectar el DOM
            setTimeout(() => {
                const previews = document.querySelectorAll('.img-preview');
                const sourceImg = previews[currentImg];
                if (!sourceImg) return;

                lbImg.src = sourceImg.src;

                // Aplicar rotación sincronizada
                const rot = parseInt(sourceImg.getAttribute('data-rotation') || 0);
                lbImg.setAttribute('data-rotation', rot);
                const scale = (rot % 180 !== 0) ? 0.75 : 1;
                lbImg.style.transform = `rotate(${rot}deg) scale(${scale})`;

                updateLightboxInfo();
            }, 0);
        }

        document.getElementById('lightbox-prev').onclick = (e) => { e.stopPropagation(); changeImage(-1); };
        document.getElementById('lightbox-next').onclick = (e) => { e.stopPropagation(); changeImage(1); };

        function closeLightbox() {
            lightbox.classList.remove('activo');
        }

        document.getElementById('lightbox-close').onclick = closeLightbox;
        lightbox.onclick = (e) => { if (e.target === lightbox) closeLightbox(); };

        if (lbDownload) {
            lbDownload.onclick = async (e) => {
                e.stopPropagation();
                const src = lbImg.src;
                if (!src) return;

                const originalHtml = lbDownload.innerHTML;
                lbDownload.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
                
                try {
                    const base64 = await imgUrlToBase64(src);
                    if (base64) {
                        const link = document.createElement('a');
                        link.href = base64;
                        const timestamp = new Date().getTime();
                        link.download = `Evidencia_${timestamp}.jpg`;
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                    }
                } catch (err) {
                    console.error('Error al descargar:', err);
                } finally {
                    lbDownload.innerHTML = originalHtml;
                }
            };
        }

        document.getElementById('prevVisita').onclick = () => {
            visitaIndex = (visitaIndex - 1 + filteredVisitas.length) % filteredVisitas.length;
            renderVisita(visitaIndex);
        };
        document.getElementById('nextVisita').onclick = () => {
            visitaIndex = (visitaIndex + 1) % filteredVisitas.length;
            renderVisita(visitaIndex);
        };

        // --- LÓGICA GENERACIÓN PPTX (ESTILO PREMIUM) ---
        async function imgUrlToBase64(url) {
            try {
                let fetchUrl = url;
                // Rutear por el proxy del backend para evitar bloqueo CORS con R2, solo si es URL externa
                if (url.startsWith('http')) {
                    fetchUrl = `/api/proxy-imagen?url=${encodeURIComponent(url)}`;
                }
                const res = await fetch(fetchUrl);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const blob = await res.blob();
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        // Resuelve con el data URI completo validado por PPTXGenJS
                        resolve(reader.result);
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (err) {
                console.error('Error cargando imagen:', err);
                return null;
            }
        }

        async function getImgDataWithDimensions(url) {
            const dataUrl = await imgUrlToBase64(url);
            if (!dataUrl) return null;
            return await new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve({ data: dataUrl, width: img.width, height: img.height });
                img.onerror = () => resolve(null);
                img.src = dataUrl;
            });
        }

        // Descarga varias imágenes en paralelo (con límite de concurrencia) en vez de una por una.
        // Esto es lo que evita que el PPT tarde mucho: antes cada foto esperaba a que termine la anterior.
        async function prefetchImagenes(urls, limite = 6, onProgreso) {
            const cache = new Map();
            const unicas = [...new Set(urls)];
            let hechas = 0;
            let idx = 0;
            async function worker() {
                while (idx < unicas.length) {
                    const i = idx++;
                    const url = unicas[i];
                    cache.set(url, await getImgDataWithDimensions(url));
                    hechas++;
                    if (onProgreso) onProgreso(hechas, unicas.length);
                }
            }
            const workers = Array.from({ length: Math.min(limite, unicas.length) }, worker);
            await Promise.all(workers);
            return cache;
        }

        async function generarReportePPTX() {
            const btn = document.getElementById('btnExportarPPTX');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Generando...</span>';
            btn.disabled = true;

            try {
                // Usar las visitas ya filtradas en pantalla
                const ultimasVisitas = filteredVisitas;

                if (!ultimasVisitas || ultimasVisitas.length === 0) {
                    alert('No hay visitas aprobadas para exportar con los filtros actuales.');
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                    return;
                }

                const pptx = new PptxGenJS();
                pptx.layout = 'LAYOUT_16x9';

                // --- A. PORTADA (GRIS CLARO CON HEADER ROJO) ---
                const slidePortada = pptx.addSlide();
                slidePortada.bkgd = { color: 'F5F5F5' }; // Fondo Gris Claro

                // Header Rojo en Portada (Mismo alto que las demás: 0.6)
                slidePortada.addShape(pptx.ShapeType.rect, {
                    x: 0, y: 0, w: 10, h: 0.6,
                    fill: { color: 'DC2626' }
                });

                const logoUrl = '/IMG/logo.png';
                const logoB64 = await imgUrlToBase64(logoUrl);

                // Variables para dimensiones del logo calculadas (para uso en todas las slides)
                let headerLogoW, headerLogoH;

                if (logoB64) {
                    // Calculamos proporciones reales para evitar estiramiento
                    const imgObj = new Image();
                    await new Promise(res => { imgObj.onload = res; imgObj.src = logoUrl; });
                    const ratio = imgObj.width / imgObj.height;

                    // 1. Logo en PORTADA (FUERA del header, centrado en el fondo gris)
                    let coverLogoW = 3.5;
                    let coverLogoH = coverLogoW / ratio;
                    if (coverLogoH > 1.8) {
                        coverLogoH = 1.8;
                        coverLogoW = coverLogoH * ratio;
                    }

                    slidePortada.addImage({
                        data: logoB64,
                        x: (10 - coverLogoW) / 2, // Centrado horizontal
                        y: 1.0, // Posicionado debajo del header
                        w: coverLogoW,
                        h: coverLogoH,
                        sizing: { type: 'contain', w: coverLogoW, h: coverLogoH }
                    });

                    // 2. Dimensiones para Header de slides internas (re-utilizables)
                    headerLogoH = 0.45;
                    headerLogoW = headerLogoH * ratio;
                    if (headerLogoW > 1.8) {
                        headerLogoW = 1.8;
                        headerLogoH = headerLogoW / ratio;
                    }
                }

                slidePortada.addText('Reporte Fotográfico de Visitas', {
                    x: 0, y: 3.2, w: '100%', h: 0.8,
                    fontSize: 32, color: '8B0000', bold: true, align: 'center', fontFace: 'Arial'
                });

                slidePortada.addText(`Exportado el: ${new Date().toLocaleDateString('es-AR')}`, {
                    x: 0, y: 4.8, w: '100%', h: 0.4,
                    fontSize: 12, color: '666666', align: 'center'
                });



                // --- B. DIAPOSITIVAS DE CONTENIDO ---

                // Prefetch en paralelo de TODAS las imágenes que van a usarse (antes se pedían una por una)
                const todasLasUrls = [];
                for (const v of ultimasVisitas) {
                    for (const img of v.imagenes) todasLasUrls.push(img.ruta);
                }
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Descargando imágenes...</span>`;
                const cacheImagenes = await prefetchImagenes(todasLasUrls, 6, (hechas, total) => {
                    btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> <span>Descargando imágenes ${hechas}/${total}...</span>`;
                });
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Generando...</span>';

                for (const v of ultimasVisitas) {
                    let imageChunks = [];
                    if (v.imagenes.length <= 3) {
                        imageChunks.push(v.imagenes);
                    } else if (v.imagenes.length === 4) {
                        imageChunks.push(v.imagenes.slice(0, 2), v.imagenes.slice(2, 4));
                    } else if (v.imagenes.length === 5) {
                        imageChunks.push(v.imagenes.slice(0, 3), v.imagenes.slice(3, 5));
                    } else {
                        for (let k = 0; k < v.imagenes.length; k += 3) {
                            imageChunks.push(v.imagenes.slice(k, k + 3));
                        }
                    }

                    for (let cIdx = 0; cIdx < imageChunks.length; cIdx++) {
                        const imgs = imageChunks[cIdx];
                        const count = imgs.length;

                        const slide = pptx.addSlide();
                        slide.bkgd = { color: 'F9F9F9' };

                        // Header Rojo
                        slide.addShape(pptx.ShapeType.rect, {
                            x: 0, y: 0, w: 10, h: 0.6,
                            fill: { color: 'DC2626' }
                        });

                        if (logoB64 && headerLogoW) {
                            slide.addImage({
                                data: logoB64,
                                x: 0.2, y: (0.6 - headerLogoH) / 2, // Centrado vertical en el header
                                w: headerLogoW,
                                h: headerLogoH,
                                sizing: { type: 'contain', w: headerLogoW, h: headerLogoH }
                            });
                        }

                        const fechaStr = new Date(v.fecha).toLocaleDateString('es-AR', { timeZone: 'UTC' });
                        const headerTextVisita = window._esAGD
                            ? (imageChunks.length > 1 ? `Parte ${cIdx + 1}` : '')
                            : `Visita del: ${fechaStr}${imageChunks.length > 1 ? ` (Parte ${cIdx + 1})` : ''}`;
                        if (headerTextVisita) {
                            slide.addText(headerTextVisita, {
                                x: 1.5, y: 0.05, w: 8.3, h: 0.5,
                                fontSize: 12, color: 'FFFFFF', align: 'right', valign: 'middle', bold: true
                            });
                        }

                        // Título Cadena y PDV
                        slide.addText(v.cadena, {
                            x: 0.5, y: 0.7, w: 9, h: 0.4,
                            fontSize: 24, color: 'DC2626', bold: true
                        });
                        const direccionText = `${v.sucursal} - ${formatUbicacion(v)}`;
                        const lineaCompleta = (window._esAGD && v.repositor)
                            ? `${direccionText}  |  Repositor: ${v.repositor}`
                            : direccionText;
                        slide.addText(lineaCompleta, {
                            x: 0.5, y: 1.1, w: 9, h: 0.3,
                            fontSize: 14, color: '666666'
                        });

                        // Layout dinámico centrado para 1, 2 o 3 imágenes
                        const areaY = 1.6, areaW = 9, areaH = 3.8;
                        // const count and imgs already defined above
                        const gutter = 0.3; // Espaciado entre fotos

                        let cW = (areaW - (count - 1) * gutter) / count;
                        let cH = areaH;
                        let startX = 0.5;

                        // Mejoramos las proporciones para no estirar cajas horizontales a fotos verticales
                        if (count === 1) {
                            cW = 5;
                            startX = 0.5 + (areaW - cW) / 2; // Centrado
                        } else if (count === 2) {
                            cW = 4;
                            startX = 0.5 + (areaW - (cW * 2 + gutter)) / 2; // Centrado
                        }

                        for (let i = 0; i < count; i++) {
                            const imgObj = cacheImagenes.get(imgs[i].ruta);
                            if (imgObj) {
                                const imgRatio = imgObj.width / imgObj.height;
                                const boxRatio = cW / cH;
                                let finalW, finalH;

                                if (imgRatio > boxRatio) {
                                    finalW = cW;
                                    finalH = cW / imgRatio;
                                } else {
                                    finalH = cH;
                                    finalW = cH * imgRatio;
                                }
                                
                                const finalX = startX + i * (cW + gutter) + (cW - finalW) / 2;
                                const finalY = areaY + (cH - finalH) / 2;

                                slide.addImage({
                                    data: imgObj.data,
                                    x: finalX,
                                    y: finalY,
                                    w: finalW,
                                    h: finalH
                                });
                            }
                        }
                    }
                }

                await pptx.writeFile({ fileName: `Reporte_Fotografico_Visitas_${new Date().toISOString().slice(0,10)}.pptx` });

            } catch (err) {
                console.error('Error al generar PPTX:', err);
                alert('Hubo un error al generar el PowerPoint.');
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        document.getElementById('btnExportarPPTX').onclick = generarReportePPTX;
        document.getElementById('btnAplicarFiltros').onclick = applyFilters;
        document.getElementById('btnLimpiarFiltros').onclick = clearFilters;
        document.addEventListener('DOMContentLoaded', cargarVisitasCliente);

        // ── ZOOM EN LIGHTBOX ────────────────────────────────────────────────────
        (function initLightboxZoom() {
            const wrapper = document.getElementById('lightbox-img-wrapper');
            const img     = document.getElementById('lightbox-img');

            let scale     = 1;
            let panX      = 0;
            let panY      = 0;
            const MIN_SCALE = 1;
            const MAX_SCALE = 5;
            const STEP      = 0.4;

            let isDragging  = false;
            let dragStartX  = 0, dragStartY  = 0;
            let panStartX   = 0, panStartY   = 0;

            let lastPinchDist = null;
            let isTouchPanning = false;
            let touchStartX = 0, touchStartY = 0;
            let panStartXT  = 0, panStartYT  = 0;

            function applyTransform() {
                const cur      = img.style.transform || '';
                const rotMatch = cur.match(/rotate\([^)]+\)/);
                const rotScale = cur.match(/scale\(0\.\d+\)/) || [];
                const rotPart  = rotMatch  ? rotMatch[0]  + ' ' : '';
                const rScalePart = rotScale[0] ? rotScale[0] + ' ' : '';
                img.style.transform = `${rotPart}${rScalePart}scale(${scale}) translate(${panX / scale}px, ${panY / scale}px)`;
                wrapper.style.cursor = scale > 1 ? (isDragging ? 'grabbing' : 'grab') : 'default';
                // Actualizar estado de los botones zoom
                const btnZoomOut = document.getElementById('lightbox-zoom-out');
                const btnZoomIn  = document.getElementById('lightbox-zoom-in');
                if (btnZoomOut) {
                    btnZoomOut.disabled = scale <= MIN_SCALE;
                    btnZoomOut.classList.toggle('btn-zoom-out-disabled', scale <= MIN_SCALE);
                }
                if (btnZoomIn) {
                    btnZoomIn.disabled = scale >= MAX_SCALE;
                    btnZoomIn.classList.toggle('btn-zoom-in-disabled', scale >= MAX_SCALE);
                }
            }

            function clampPan() {
                const maxPanX = ((scale - 1) / scale) * (wrapper.offsetWidth  / 2) * scale;
                const maxPanY = ((scale - 1) / scale) * (wrapper.offsetHeight / 2) * scale;
                panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
                panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
            }

            function zoomBy(delta) {
                const prev = scale;
                scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + delta));
                if (scale === 1) { panX = 0; panY = 0; }
                clampPan();
                applyTransform();
            }

            function resetZoom() {
                scale = 1; panX = 0; panY = 0;
                applyTransform();
            }

            const origOpenLightbox = window.openLightbox;
            window.openLightbox = function(index) { resetZoom(); origOpenLightbox(index); };
            const origChangeImage = window.changeImage;
            window.changeImage = function(delta) { resetZoom(); origChangeImage(delta); };

            wrapper.addEventListener('wheel', e => { e.preventDefault(); zoomBy(e.deltaY < 0 ? STEP : -STEP); }, { passive: false });

            document.getElementById('lightbox-zoom-in') .addEventListener('click', () => zoomBy(STEP));
            document.getElementById('lightbox-zoom-out').addEventListener('click', () => zoomBy(-STEP));

            wrapper.addEventListener('mousedown', e => {
                if (scale <= 1) return;
                isDragging = true; dragStartX = e.clientX; dragStartY = e.clientY;
                panStartX = panX; panStartY = panY; e.preventDefault();
            });
            window.addEventListener('mousemove', e => {
                if (!isDragging) return;
                panX = panStartX + (e.clientX - dragStartX);
                panY = panStartY + (e.clientY - dragStartY);
                clampPan(); applyTransform();
            });
            window.addEventListener('mouseup', () => { isDragging = false; applyTransform(); });

            wrapper.addEventListener('touchstart', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const t1 = e.touches[0], t2 = e.touches[1];
                    lastPinchDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                } else if (e.touches.length === 1 && scale > 1) {
                    isTouchPanning = true;
                    touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
                    panStartXT  = panX; panStartYT = panY;
                }
            }, { passive: false });

            wrapper.addEventListener('touchmove', e => {
                if (e.touches.length === 2) {
                    e.preventDefault();
                    const t1 = e.touches[0], t2 = e.touches[1];
                    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
                    if (lastPinchDist !== null) {
                        scale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, scale + (dist - lastPinchDist) * 0.02));
                        if (scale === 1) { panX = 0; panY = 0; }
                        clampPan(); applyTransform();
                    }
                    lastPinchDist = dist;
                } else if (e.touches.length === 1 && isTouchPanning) {
                    e.preventDefault();
                    panX = panStartXT + (e.touches[0].clientX - touchStartX);
                    panY = panStartYT + (e.touches[0].clientY - touchStartY);
                    clampPan(); applyTransform();
                }
            }, { passive: false });

            wrapper.addEventListener('touchend', e => {
                if (e.touches.length < 2) lastPinchDist = null;
                if (e.touches.length === 0) isTouchPanning = false;
            });

            let lastTap = 0;
            wrapper.addEventListener('touchend', e => {
                if (e.changedTouches.length !== 1) return;
                const now = Date.now();
                if (now - lastTap < 300) { e.preventDefault(); if (scale > 1) resetZoom(); else { scale = 2.5; clampPan(); applyTransform(); } }
                lastTap = now;
            });
        })();
        // ── FIN ZOOM ─────────────────────────────────────────────────────────────
    </script>
    <!-- filtros utility -->
    <script src="js/filtros.js"></script>
