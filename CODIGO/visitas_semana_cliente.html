<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Visitas por Semana por Cliente</title>
    <link rel="icon" href="../IMG/logo2.jpg" type="image/jpg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style/shared.css">
    <link rel="stylesheet" href="style/vista_fotos.css">
    <link rel="stylesheet" href="style/filtros.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="style/filtrosMultiseleccion.css">
</head>

<body>

    <header class="header">
        <div class="header-left">
            <a href="Admin_gestion_visitas.html" class="btn-volver">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
            </a>
        </div>
        <div class="header-center">
            <img src="../IMG/logo.png" alt="Logo Grupo Solvens" class="logo-nav">
        </div>
        <div class="header-right">
            <a href="login.html" class="btn-salir">Cerrar Sesión</a>
        </div>
    </header>

    <main class="area-contenido area-contenido-centrada">
        <h1 class="page-titulo">Visitas por <span>Semana</span></h1>
        <p class="page-subtitulo">Consultá la cantidad de visitas cargadas en la semana en curso por cliente.</p>

        <div class="controles-consulta">
            <div class="filtro-item">
                <label class="label-pequeno">Seleccione Cliente</label>
                <select id="selCliente" class="select-filtro select-consulta-cliente">
                    <option>Cargando...</option>
                </select>
            </div>

            <div class="filtro-item">
                <label class="label-pequeno">Seleccione Zona</label>
                <select id="selZona" class="select-filtro select-consulta-filtro" multiple style="display:none">
                    <option value="">Todas</option>
                </select>
                <div id="msWrapZona"></div>
            </div>

            <button id="btnBuscar" class="btn-consultar">Consultar</button>

            <button id="btnExportar" class="btn-exportar-excel">
                <i class="fas fa-file-excel"></i> Exportar a Excel
            </button>
        </div>

        <div class="tabla-wrapper">
            <table class="tabla-reporte" id="tblResultados">
                <thead>
                    <tr>
                        <th>Sucursal / Punto de Venta</th>
                        <th>Zona</th>
                        <th class="col-centrada">Visitas en la Semana</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="3" class="estado-tabla-inicial">
                            Seleccione un cliente y haga clic en consultar para ver los resultados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script>
        async function cargarClientes() {
            const sel = document.getElementById('selCliente');
            try {
                const res = await fetch('/api/clientes-activos');
                const clients = await res.json();
                sel.innerHTML = '<option value="" disabled selected>-- elija --</option>' +
                    clients.map(c => `<option value="${c.ID}">${c.Nombre}</option>`).join('');
            } catch (e) {
                sel.innerHTML = '<option error>Carga fallida</option>';
                console.error(e);
            }
        }

        async function cargarZonas() {
            const sel = document.getElementById('selZona');
            try {
                const res = await fetch('/api/zonas');
                const zonas = await res.json();
                sel.innerHTML = '<option value="">Todas</option>' +
                    zonas.map(z => `<option value="${z.id}">${z.nombre}</option>`).join('');
            } catch (e) {
                sel.innerHTML = '<option value="">Error al cargar</option>';
            }
        }

        async function consultar() {
            const sel = document.getElementById('selCliente');
            const id = sel.value;
            const selZona = document.getElementById('selZona');
            const zonasSeleccionadas = Array.from(selZona.selectedOptions).map(o => o.value).filter(v => v);
            if (!id) return;
            const tbody = document.querySelector('#tblResultados tbody');
            tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding:40px;"><div class="spinner"></div><p style="margin-top:10px;">Consultando datos...</p></td></tr>';
            try {
                let url = `/api/visitas-semana-cliente?id_cliente=${id}`;
                if (zonasSeleccionadas.length > 0) url += `&id_zona=${zonasSeleccionadas.join(',')}`;
                const res = await fetch(url);
                let rows = await res.json();

                if (!Array.isArray(rows) || rows.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">No se encontraron sucursales para este cliente.</td></tr>';
                    return;
                }

                tbody.innerHTML = rows.map(r => `<tr>
                    <td>${r.NombreSucursal}</td>
                    <td>${r.Zona || '-'}</td>
                    <td style="text-align: center; font-weight: bold; color: ${r.VisitasSemanales > 0 ? '#16a34a' : '#dc2626'}">
                        ${r.VisitasSemanales}
                    </td>
                </tr>`).join('');

                ultimaConsulta = rows;

            } catch (e) {
                console.error(e);
                tbody.innerHTML = '<tr><td colspan="3">Error en consulta</td></tr>';
            }
        }

        let ultimaConsulta = [];

        document.addEventListener('DOMContentLoaded', () => {
            const tipo = Number(sessionStorage.getItem('tipoUsuario'));
            if (tipo !== 1) { window.location.href = 'login.html'; return; }
            cargarClientes();
            cargarZonas();
            document.getElementById('btnBuscar').addEventListener('click', consultar);
            document.getElementById('btnExportar').addEventListener('click', exportarExcel);
            initMultiSelect('msWrapZona', 'selZona', 'Zona (todas)');
        });

        function initMultiSelect(containerId, realSelectId, placeholder) {
            const container = document.getElementById(containerId);
            const realSel   = document.getElementById(realSelectId);
            if (!container || !realSel) return;
            realSel.style.display = 'none';
            const wrap = document.createElement('div'); wrap.className = 'ms-wrap';
            const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'ms-trigger';
            trigger.innerHTML = `<span class="ms-label">${placeholder}</span><span class="ms-arrow">▼</span>`;
            const panel = document.createElement('div'); panel.className = 'ms-panel';
            const searchWrap = document.createElement('div'); searchWrap.className = 'ms-search';
            searchWrap.innerHTML = '<i class="fas fa-search"></i><input type="text" placeholder="Buscar...">';
            const searchInput = searchWrap.querySelector('input');
            const allRow = document.createElement('div'); allRow.className = 'ms-all';
            const allCb = document.createElement('input'); allCb.type = 'checkbox';
            allRow.appendChild(allCb); allRow.appendChild(document.createTextNode(' Todas'));
            panel.appendChild(searchWrap); panel.appendChild(allRow);
            wrap.appendChild(trigger); wrap.appendChild(panel); container.appendChild(wrap);
            function rebuildOptions() {
                Array.from(panel.querySelectorAll('.ms-option')).forEach(n => n.remove());
                Array.from(realSel.options).forEach(opt => {
                    if (opt.value === '') return;
                    const row = document.createElement('div'); row.className = 'ms-option'; row.dataset.value = opt.value;
                    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = opt.value; cb.checked = opt.selected;
                    const lbl = document.createElement('label'); lbl.textContent = opt.textContent; lbl.style.cursor = 'pointer';
                    cb.addEventListener('change', () => {
                        Array.from(realSel.options).forEach(o => { if (o.value === cb.value) o.selected = cb.checked; });
                        syncAll(); updateTrigger(); realSel.dispatchEvent(new Event('change', { bubbles: true }));
                    });
                    row.addEventListener('click', (e) => { if (e.target !== cb) { cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); } });
                    row.appendChild(cb); row.appendChild(lbl); panel.appendChild(row);
                });
                syncAll(); updateTrigger();
            }
            function syncAll() {
                const opts = panel.querySelectorAll('.ms-option input[type=checkbox]');
                const allChecked = opts.length > 0 && Array.from(opts).every(c => c.checked);
                allCb.checked = allChecked; allCb.indeterminate = !allChecked && Array.from(opts).some(c => c.checked);
            }
            function updateTrigger() {
                const sel = Array.from(realSel.selectedOptions).filter(o => o.value);
                const labelEl = trigger.querySelector('.ms-label'); let badge = trigger.querySelector('.ms-badge');
                if (sel.length === 0) { labelEl.textContent = placeholder; if (badge) badge.remove(); }
                else if (sel.length === 1) { labelEl.textContent = sel[0].textContent; if (badge) badge.remove(); }
                else { labelEl.textContent = `${sel.length} seleccionadas`; if (!badge) { badge = document.createElement('span'); badge.className = 'ms-badge'; trigger.insertBefore(badge, trigger.querySelector('.ms-arrow')); } badge.textContent = sel.length; }
            }
            allRow.addEventListener('click', (e) => {
                if (e.target !== allCb) { allCb.checked = !allCb.checked; }
                const check = allCb.checked;
                panel.querySelectorAll('.ms-option input[type=checkbox]').forEach(cb => {
                    if (!cb.closest('.ms-option').classList.contains('hidden')) { cb.checked = check; Array.from(realSel.options).forEach(o => { if (o.value === cb.value) o.selected = check; }); }
                });
                allCb.indeterminate = false; updateTrigger(); realSel.dispatchEvent(new Event('change', { bubbles: true }));
            });
            searchInput.addEventListener('input', () => { const q = searchInput.value.toLowerCase(); panel.querySelectorAll('.ms-option').forEach(row => { row.classList.toggle('hidden', !row.querySelector('label').textContent.toLowerCase().includes(q)); }); });
            searchInput.addEventListener('click', e => e.stopPropagation());
            trigger.addEventListener('click', (e) => { e.stopPropagation(); const isOpen = panel.classList.contains('open'); document.querySelectorAll('.ms-panel.open').forEach(p => { p.classList.remove('open'); p.previousElementSibling?.classList.remove('open'); }); if (!isOpen) { panel.classList.add('open'); trigger.classList.add('open'); searchInput.focus(); } });
            document.addEventListener('click', () => { panel.classList.remove('open'); trigger.classList.remove('open'); });
            panel.addEventListener('click', e => e.stopPropagation());
            new MutationObserver(() => { rebuildOptions(); }).observe(realSel, { childList: true });
            rebuildOptions();
        }

        function mostrarToast(mensaje, tipo = 'exito') {
            const t = document.getElementById('toast');
            t.textContent = mensaje;
            t.className = 'toast ' + tipo;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3500);
        }

        function exportarExcel() {
            if (!ultimaConsulta || ultimaConsulta.length === 0) {
                mostrarToast('No hay datos para exportar', 'aviso');
                return;
            }
            
            // Obtener el nombre del cliente seleccionado
            const sel = document.getElementById('selCliente');
            const nombreCliente = sel && sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '';

            // preparar datos formato JSON para SheetJS
            const datosParaExportar = ultimaConsulta.map(r => ({
                Sucursal: r.NombreSucursal || '',
                Zona: r.Zona || '',
                "Visitas en la Semana": r.VisitasSemanales
            }));
            
            // Agregar el nombre del cliente dentro del archivo Excel (filas 1 y 2)
            const hoja = XLSX.utils.aoa_to_sheet([
                ["Cliente:", nombreCliente],
                []
            ]);
            XLSX.utils.sheet_add_json(hoja, datosParaExportar, { origin: "A3" });

            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Visitas Semanales");
            
            // Limpiar el nombre del cliente para evitar caracteres no válidos en el nombre del archivo
            const nombreClienteLimpio = nombreCliente ? nombreCliente.replace(/[/\\?%*:|"<>]/g, '-').trim() : '';
            const nombreArchivo = nombreClienteLimpio 
                ? `Visitas_Semanales_${nombreClienteLimpio}_${new Date().toISOString().slice(0, 10)}.xlsx`
                : `Visitas_Semanales_${new Date().toISOString().slice(0, 10)}.xlsx`;

            XLSX.writeFile(libro, nombreArchivo);
        }
    </script>
    <div class="toast" id="toast"></div>

</body>

</html>
