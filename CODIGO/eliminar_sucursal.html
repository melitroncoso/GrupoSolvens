<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Grupo Solvens - Carga de Puntos de Venta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../IMG/logo2.jpg" type="image/jpg">
    <link rel="stylesheet" href="style/shared.css">
    <link rel="stylesheet" href="style/formulario.css">
    <link rel="stylesheet" href="style/modal.css">
</head>

<body>

    <header class="header">
        <div class="header-left">
            <a href="Admin_gestion_sucursal.html" class="btn-volver">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
            </a>
        </div>
        <div class="header-center">
            <img src="../IMG/logo.png" alt="Logo Grupo Solvens" class="logo-nav">
        </div>
        <div class="header-right">
            <a href="login.html" class="btn-salir">Cerrar Sesión</a>
        </div>
    </header>

    <main class="contenido">
        <h1>Eliminar <span>Sucursal</span></h1>
        <p class="subtitulo">Filtre para encontrar la sucursal a eliminar</p>

        <div class="formulario">
            <div class="fila">
                <select id="select-cadena">
                    <option value="" disabled selected>1. Seleccione Cadena</option>
                </select>
            </div>

            <div class="fila">
                <select id="select-subzona" disabled>
                    <option value="" disabled selected>2. Seleccione Subzona</option>
                </select>
            </div>

            <div class="fila">
                <select id="select-sucursal" disabled>
                    <option value="" disabled selected>3. Seleccione la Sucursal</option>
                </select>
            </div>

            <button id="btn-eliminar" disabled>Eliminar Sucursal</button>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script>
        function mostrarToast(mensaje, tipo = 'exito') {
            const t = document.getElementById('toast');
            t.textContent = mensaje;
            t.className = 'toast ' + tipo;
            t.classList.add('visible');
            setTimeout(() => t.classList.remove('visible'), 3500);
        }

        const URL_BASE = '/api';
        const selCadena   = document.getElementById('select-cadena');
        const selSubzona  = document.getElementById('select-subzona');
        const selSucursal = document.getElementById('select-sucursal');
        const btnEliminar = document.getElementById('btn-eliminar');

        // ── Helpers de reset ──────────────────────────────────────────────
        function resetSubzona() {
            selSubzona.innerHTML = '<option value="" disabled selected>2. Seleccione Subzona</option>';
            selSubzona.disabled = true;
            resetSucursal();
        }

        function resetSucursal() {
            selSucursal.innerHTML = '<option value="" disabled selected>3. Seleccione la Sucursal</option>';
            selSucursal.disabled = true;
            btnEliminar.disabled = true;
        }

        // ── Inicialización: Cargar Cadenas ────────────────────────────────
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const res = await fetch(`${URL_BASE}/cadenas`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                data.forEach(c => {
                    selCadena.innerHTML += `<option value="${c.ID}">${c.Nombre}</option>`;
                });
            } catch (err) {
                mostrarToast('Error al cargar las cadenas', 'error');
                console.error('Error cadenas:', err);
            }
        });

        // ── Evento 1: Cadena → cargar Subzonas filtradas ──────────────────
        selCadena.addEventListener('change', async () => {
            resetSubzona();
            try {
                // CORRECCIÓN: se filtra por id_cadena para traer solo las subzonas correspondientes
                const res = await fetch(`${URL_BASE}/subzonas?id_cadena=${selCadena.value}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.length === 0) {
                    selSubzona.innerHTML = '<option value="" disabled selected>No hay subzonas para esta cadena</option>';
                } else {
                    selSubzona.innerHTML = '<option value="" disabled selected>2. Seleccione Subzona</option>';
                    data.forEach(s => {
                        selSubzona.innerHTML += `<option value="${s.ID}">${s.Nombre}</option>`;
                    });
                    selSubzona.disabled = false;
                }
            } catch (err) {
                mostrarToast('Error al cargar las subzonas', 'error');
                console.error('Error subzonas:', err);
            }
        });

        // ── Evento 2: Subzona → buscar Sucursales filtradas ───────────────
        selSubzona.addEventListener('change', async () => {
            resetSucursal();
            try {
                const res = await fetch(`${URL_BASE}/buscar-sucursales?id_cadena=${selCadena.value}&id_subzona=${selSubzona.value}`);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();

                if (data.length === 0) {
                    selSucursal.innerHTML = '<option value="" disabled selected>No hay sucursales en esta zona</option>';
                } else {
                    selSucursal.innerHTML = '<option value="" disabled selected>3. Seleccione la Sucursal</option>';
                    data.forEach(s => {
                        const alt = s.Altura ? ` ${s.Altura}` : '';
                        selSucursal.innerHTML += `<option value="${s.ID}">${s.Localidad} — ${s.Calle}${alt}</option>`;
                    });
                    selSucursal.disabled = false;
                }
            } catch (err) {
                mostrarToast('Error al cargar las sucursales', 'error');
                console.error('Error sucursales:', err);
            }
        });

        // ── Evento 3: Sucursal → habilitar botón ─────────────────────────
        selSucursal.addEventListener('change', () => {
            btnEliminar.disabled = selSucursal.value === '';
        });

        // ── Acción: Eliminar ──────────────────────────────────────────────
        btnEliminar.addEventListener('click', async () => {
            const nombreSucursal = selSucursal.options[selSucursal.selectedIndex].text;
            const confirmar = confirm(`¿Eliminar la sucursal "${nombreSucursal}"? Esta acción no se puede deshacer.`);
            if (!confirmar) return;

            btnEliminar.disabled = true;
            btnEliminar.textContent = 'Eliminando...';

            try {
                const id = selSucursal.value;
                const res = await fetch(`${URL_BASE}/eliminar-sucursal/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const result = await res.json();

                if (result.success) {
                    mostrarToast(result.message || 'Eliminada correctamente', 'exito');
                    setTimeout(() => location.reload(), 1800);
                } else {
                    mostrarToast(result.message || 'Error al eliminar', 'error');
                    btnEliminar.disabled = false;
                    btnEliminar.textContent = 'Eliminar Sucursal';
                }
            } catch (err) {
                mostrarToast('Error de conexión con el servidor', 'error');
                console.error('Error eliminar:', err);
                btnEliminar.disabled = false;
                btnEliminar.textContent = 'Eliminar Sucursal';
            }
        });
    </script>

</body>

</html>
