<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carga de Visita - Solvens</title>
    <link rel="icon" href="../IMG/logo2.jpg" type="image/jpg">
    <link rel="stylesheet" href="style/shared.css">
    <link rel="stylesheet" href="style/carga_visitas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="header">
        <div class="header-left">
            <a href="inicioRepositor.html" class="btn-volver">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12" />
                    <polyline points="12 19 5 12 12 5" />
                </svg>
            </a>
        </div>
        <div class="header-center">
            <img src="../IMG/logo.png" alt="Logo Grupo Solvens" class="logo-nav">
        </div>
        <div class="header-right">
            <a href="login.html" class="btn-salir">Cerrar Sesión</a>
        </div>
    </header>

    <div class="contenedor">
        <h1 class="page-titulo">Carga de <span>Visita</span></h1>
        
        <form id="visitaForm">

            <!-- ── SECCIÓN CLIENTE / SUCURSAL ── -->
            <div class="seccion">
                <p class="seccion-titulo">Datos de la Visita</p>
                <div class="select-wrapper">
                    <select id="cliente" required>
                        <option value="" disabled selected>Seleccione Cliente</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="cadena" required disabled>
                        <option value="" disabled selected>Seleccione Cadena</option>
                    </select>
                </div>
                <div class="select-wrapper">
                    <select id="sucursal" required disabled>
                        <option value="" disabled selected>Seleccione Sucursal</option>
                    </select>
                </div>
            </div>
            <!-- ── SECCIÓN PRODUCTOS (COMENTADA) ──
            <div class="seccion" id="seccionProductos" style="display:none;">
                <p class="seccion-titulo">Productos <span
                        style="color:#555;font-weight:400;font-size:12px;text-transform:none;letter-spacing:0;">(opcional)</span>
                </p>
                <div class="buscador-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="buscarProducto" placeholder="Buscar producto por nombre...">
                </div>
                <div id="listaProductos"></div>
            </div>
            -->

            <!-- ── SECCIÓN FOTOS ── -->
            <div class="seccion">
                <p class="seccion-titulo">Evidencia Fotográfica</p>
                <div class="file-wrapper">
                    <label class="file-label" for="fotos">
                        <i class="fas fa-camera"></i>
                        <span id="labelFotos">Seleccionar fotos (máx. 3)</span>
                    </label>
                    <input type="file" id="fotos" accept="image/*" multiple>
                    <div id="previewFotos" class="preview-fotos"></div>
                </div>
                
            </div>

            <!-- ── SECCIÓN STOCK (solo Del Valle) ── -->
            <div class="seccion" id="seccionStock" style="display:none;">
                <p class="seccion-titulo">Stock por Categoría</p>
                <p style="color:#aaa;font-size:13px;margin-bottom:16px;">Indicá el nivel de stock para cada categoría</p>
                <div id="listaStock"></div>
            </div>

            <div class="indicacion-final elegante">
                <div class="icono-advertencia">
                    <i class="fas fa-exclamation-circle"></i>
                </div>
                <div class="texto-indicacion">
                    <p class="indicacion-titulo">Paso final</p>
                    <p class="indicacion-descripcion">
                        Para completar la carga de la visita, debe presionar el botón
                        <span class="accion-final">Registrar Visita</span>
                    </p>
                </div>
            </div>

            <button type="submit" class="btn-registrar">
                <i class="fas fa-paper-plane icono-btn"></i>Registrar Visita
            </button>

        </form>
    </div>

    <!-- ── TOAST ÉXITO ── -->
    <div id="toast-exito" class="toast-exito">
        <i class="fas fa-check-circle"></i>
        <span>Registro exitoso</span>
    </div>

    <!-- ── TOAST FOTOS ── -->
    <div id="toast-fotos" class="toast-exito">
        <i class="fas fa-images icono-fotos-toast"></i>
        <span id="toast-fotos-texto"></span>
    </div>

    <!-- ── TOAST ERROR ── -->
    <div id="toast-error" class="toast-exito toast-error-custom">
        <i class="fas fa-exclamation-circle"></i>
        <span id="toast-error-texto"></span>
    </div>

    <script>
        // --- ESTADO ---
        let productosOriginales = [];
        let datosIngresados = {};
        let todasLasSucursales = [];
        let stockSeleccionado = {}; // lista completa luego de cargar cliente
        let totalCategorias = 0;   // cantidad de categorías a validar en submit

        // --- DOM ---
        const clienteSel  = document.getElementById('cliente');
        const cadenaSel   = document.getElementById('cadena');
        const sucursalSel = document.getElementById('sucursal');
        const inputFotos  = document.getElementById('fotos');
        const labelFotos  = document.getElementById('labelFotos');

        // ID del repositor logueado — fuente de verdad para el filtro de zona
        const idRepo = sessionStorage.getItem('id_usuario');

        /* 
        const buscarInput = document.getElementById('buscarProducto');
        const prodContenedor = document.getElementById('listaProductos');
        const seccionProd = document.getElementById('seccionProductos');
        */

        // ── HELPERS ──────────────────────────────────────────────────────────────

        // ── STOCK ────────────────────────────────────────────────────────────────
        // Paleta de colores para niveles de stock normales (Sin stock → Mucho)
        const COLORES_STOCK_NORMAL = ['#dc2626', '#f59e0b', '#3b82f6', '#22c55e'];

        // IDs de tipo_stock para exhibición en góndola (deben coincidir con la BD)
        const ID_EXHIBIDO_GONDOLA     = 7;
        const ID_NO_EXHIBIDO_GONDOLA  = 8;

        // Detecta si una categoria es de sidra (para mostrar checkbox de gondola)
        function esCategoríaSidra(nombreCat) {
            const n = nombreCat.trim().toLowerCase();
            return n.startsWith('sidra') && n !== 'repone sidra';
        }

        // stockGondola guarda el id_tipo_stock elegido para la gondola de cada categoria sidra
        // { id_categoria: 7 | 8 }  — se inicializa en 8 (No exhibido) para cada sidra al cargar
        let stockGondola = {};

        async function cargarCategoriasStock(idCliente) {
            try {
                const res = await fetch(`/api/categorias-stock?id_cliente=${idCliente}`);
                const cats = await res.json();
                const seccion = document.getElementById('seccionStock');
                const lista = document.getElementById('listaStock');

                if (!cats || cats.length === 0) {
                    seccion.style.display = 'none';
                    return;
                }

                // Excluir "Repone Sidra" del formulario
                const catsFiltered = cats.filter(c => c.categoria.trim().toLowerCase() !== 'repone sidra');

                lista.innerHTML = '';
                stockSeleccionado = {};
                stockGondola = {};
                totalCategorias = catsFiltered.length;

                // Obtener tipos de stock para cada categoría desde el backend (en paralelo)
                const tiposPorCat = await Promise.all(
                    catsFiltered.map(cat =>
                        fetch(`/api/tipos-stock?id_categoria=${cat.id}`)
                            .then(r => r.json())
                            .catch(() => [])
                    )
                );

                catsFiltered.forEach((cat, idx) => {
                    const tipos = tiposPorCat[idx] || [];
                    const div = document.createElement('div');
                    div.style.cssText = 'padding:14px 0;border-bottom:1px solid #2a2a2a;';

                    const botonesHtml = tipos.map((t, i) => {
                        // Sí → verde, No → rojo, resto → paleta normal por índice
                        let color;
                        const tl = t.tipo.toLowerCase();
                        if (tl === 'sí' || tl === 'si') color = '#22c55e';
                        else if (tl === 'no')           color = '#dc2626';
                        else color = COLORES_STOCK_NORMAL[i % COLORES_STOCK_NORMAL.length];

                        return `<div class="stock-btn" data-catid="${cat.id}" data-nivel="${t.id}" data-color="${color}"
                                    onclick="seleccionarStock(${cat.id}, ${t.id})"
                                    style="flex:1;min-width:60px;text-align:center;padding:10px 4px;
                                           border-radius:8px;border:2px solid #333;background:#1a1a1a;
                                           font-size:12px;color:#aaa;cursor:pointer;transition:.2s;user-select:none;">${t.tipo}</div>`;
                    }).join('');

                    // Checkbox de gondola solo para categorias de sidra (no Repone Sidra)
                    let gondolaHtml = '';
                    if (esCategoríaSidra(cat.categoria)) {
                        // Inicializar en "No exhibido en gondola" (id 8) por defecto
                        stockGondola[cat.id] = ID_NO_EXHIBIDO_GONDOLA;
                        gondolaHtml = `
                        <div style="margin-top:12px;display:flex;align-items:center;gap:10px;
                                    padding:8px 10px;background:#1e1e1e;border-radius:8px;border:1px solid #2a2a2a;">
                            <span class="gondola-check" data-catid="${cat.id}" data-activo="0"
                                  onclick="toggleGondola(${cat.id})"
                                  style="display:inline-flex;align-items:center;justify-content:center;
                                         width:22px;height:22px;border-radius:5px;border:2px solid #555;
                                         background:#1a1a1a;cursor:pointer;transition:.2s;flex-shrink:0;">
                            </span>
                            <span style="font-size:12px;color:#aaa;cursor:pointer;user-select:none;"
                                  onclick="toggleGondola(${cat.id})">Exhibido en góndola</span>
                        </div>`;
                    }

                    div.innerHTML = `
                        <p style="font-size:13px;color:#e0e0e0;margin-bottom:10px;font-weight:500;">${cat.categoria}</p>
                        <div style="display:flex;gap:8px;flex-wrap:wrap;">${botonesHtml}</div>
                        ${gondolaHtml}`;
                    lista.appendChild(div);
                });

                seccion.style.display = 'block';
            } catch(err) {
                console.error('Error cargando categorías stock:', err);
            }
        }

        window.seleccionarStock = (idCat, idNivel) => {
            stockSeleccionado[idCat] = idNivel;
            document.querySelectorAll(`.stock-btn[data-catid="${idCat}"]`).forEach(btn => {
                const nivel = parseInt(btn.dataset.nivel);
                const color = btn.dataset.color || '#3b82f6';
                if (nivel === idNivel) {
                    btn.style.borderColor = color;
                    btn.style.background  = color + '22';
                    btn.style.color       = '#fff';
                } else {
                    btn.style.borderColor = '#333';
                    btn.style.background  = '#1a1a1a';
                    btn.style.color       = '#aaa';
                }
            });
        };

        // Toggle del checkbox de gondola.
        // El checkbox siempre tiene un valor (7 o 8): arranca en 8 (No exhibido).
        window.toggleGondola = (idCat) => {
            const checkEl = document.querySelector(`.gondola-check[data-catid="${idCat}"]`);
            if (!checkEl) return;

            const yaActivo = checkEl.dataset.activo === '1';

            if (yaActivo) {
                // Desmarcar → No exhibido en gondola
                checkEl.dataset.activo = '0';
                checkEl.style.background   = '#1a1a1a';
                checkEl.style.borderColor  = '#555';
                checkEl.innerHTML          = '';
                stockGondola[idCat]        = ID_NO_EXHIBIDO_GONDOLA;
            } else {
                // Marcar → Exhibido en gondola
                checkEl.dataset.activo = '1';
                checkEl.style.background   = '#22c55e';
                checkEl.style.borderColor  = '#22c55e';
                checkEl.innerHTML          = '<svg width="13" height="13" viewBox="0 0 13 13" fill="none"><polyline points="2,6.5 5.5,10 11,3" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                stockGondola[idCat]        = ID_EXHIBIDO_GONDOLA;
            }
        };

        function poblarCadenas(sucursales) {
            const cadenas = [...new Map(sucursales.map(s => [s.Cadena, s.Cadena])).values()].sort();
            cadenaSel.innerHTML = '<option value="" disabled selected>Seleccione Cadena</option>';
            cadenas.forEach(c => {
                cadenaSel.innerHTML += `<option value="${c}">${c}</option>`;
            });
            cadenaSel.disabled = cadenas.length === 0;
        }

        function poblarSucursales(cadena) {
            const filtradas = todasLasSucursales.filter(s => s.Cadena === cadena);
            sucursalSel.innerHTML = '<option value="" disabled selected>Seleccione Sucursal</option>';
            filtradas.forEach(s => {
                const altura = s.Altura ? ` ${s.Altura}` : '';
                sucursalSel.innerHTML += `<option value="${s.ID}">${s.Localidad} — ${s.Calle}${altura}</option>`;
            });
            sucursalSel.disabled = filtradas.length === 0;
            if (filtradas.length === 0) {
                sucursalSel.innerHTML = '<option value="" disabled selected>Sin sucursales en tu zona</option>';
            }
        }

        // 1. CLIENTES
        fetch('/api/clientes-activos')
            .then(r => r.json())
            .then(data => {
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.ID;
                    opt.textContent = c.Nombre;
                    clienteSel.appendChild(opt);
                });

                // Preseleccionar cliente si viene del localStorage
                const idCliGuardado = sessionStorage.getItem('id_cliente_sel');
                if (idCliGuardado) {
                    clienteSel.value = idCliGuardado;
                    if (clienteSel.value) clienteSel.dispatchEvent(new Event('change'));
                }
            })
            .catch(err => console.error('Error al cargar clientes:', err));

        // 2. CAMBIO DE CLIENTE
        // Se pasa id_repo para que el backend filtre sucursales por zona del repositor.
        // El backend ignora cualquier intento de manipular este valor porque lo lee
        // directamente de la base de datos usando el id_repo como clave.
        clienteSel.addEventListener('change', async () => {
            const idCli = clienteSel.value;
            datosIngresados = {};
            todasLasSucursales = [];

            // Resetear cadena y sucursal
            cadenaSel.innerHTML = '<option value="" disabled selected>Seleccione Cadena</option>';
            cadenaSel.disabled = true;
            sucursalSel.innerHTML = '<option value="" disabled selected>Seleccione Sucursal</option>';
            sucursalSel.disabled = true;

            if (!idRepo) {
                mostrarToastError('Sesión expirada. Por favor volvé a iniciar sesión.');
                return;
            }

            const resS = await fetch(`/api/mis-sucursales?id_cliente=${idCli}&id_repo=${idRepo}`);

            if (!resS.ok) {
                const err = await resS.json();
                mostrarToastError(err.error || 'No se pudieron cargar las sucursales.');
                return;
            }

            const sucursales = await resS.json();
            todasLasSucursales = sucursales;

            if (sucursales.length === 0) {
                cadenaSel.innerHTML = '<option value="" disabled selected>Sin cadenas en tu zona</option>';
                return;
            }

            poblarCadenas(sucursales);

            // Cargar sección de stock según lo que devuelva el backend para este cliente
            cargarCategoriasStock(clienteSel.value);

            // Preseleccionar cadena si viene del localStorage
            const cadenaGuardada = sessionStorage.getItem('cadena_sel');
            if (cadenaGuardada) {
                cadenaSel.value = cadenaGuardada;
                if (cadenaSel.value) cadenaSel.dispatchEvent(new Event('change'));
            }

            /*
            const resP = await fetch(`/api/productos-cliente?id_cliente=${idCli}`);
            productosOriginales = await resP.json();
            seccionProd.style.display = 'block';
            renderizar(productosOriginales);
            */
            
            // Actualizar label de fotos según el cliente (AGD = 5 fotos)
            const nombreCliente = clienteSel.options[clienteSel.selectedIndex]?.textContent;
            const maxFotos = (nombreCliente && (nombreCliente.toUpperCase().includes('AGD') || nombreCliente.toUpperCase().includes('DEL VALLE'))) ? 5 : 3;
            labelFotos.textContent = `Seleccionar fotos (máx. ${maxFotos})`;
            inputFotos.value = '';
            document.getElementById('previewFotos').innerHTML = '';
        });

        // 3. CAMBIO DE CADENA
        cadenaSel.addEventListener('change', () => {
            poblarSucursales(cadenaSel.value);

            // Preseleccionar sucursal si viene del localStorage
            const sucGuardada = sessionStorage.getItem('sucursal_sel');
            if (sucGuardada) {
                sucursalSel.value = sucGuardada;
            }
        });

        // 3. RENDERIZADO
        /*
        function renderizar(lista) {
            prodContenedor.innerHTML = '';
            if (lista.length === 0) {
                prodContenedor.innerHTML = '<p class="prod-vacio">No se encontraron productos.</p>';
                return;
            }
            lista.forEach(p => {
                const guardado = datosIngresados[p.ID] || { precio: '', oferta: false };
                const div = document.createElement('div');
                div.className = 'prod-item';
                div.innerHTML = `
                    <span class="prod-nombre">${p.Descripcion}</span>
                    <div class="prod-controles">
                        <input type="number" step="0.01" min="0" class="precio-input"
                               placeholder="$ —" value="${guardado.precio}"
                               oninput="guardarProgreso(${p.ID}, this.value, null)">
                        <label class="label-oferta">
                            <input type="checkbox" ${guardado.oferta ? 'checked' : ''}
                                   onchange="guardarProgreso(${p.ID}, null, this.checked)">

                    </div>`;
                prodContenedor.appendChild(div);

        }

        window.guardarProgreso = (id, precio, oferta) => {

            if (precio !== null) datosIngresados[id].precio = precio;
            if (oferta !== null) datosIngresados[id].oferta = oferta;
        };

        buscarInput.addEventListener('input', e => {

        */

        // ── UTILIDADES DE IMAGEN ─────────────────────────────────────────────────

        // Target: 2 MB por foto. El servidor igual recomprime con sharp, pero
        // así el upload en mobile es rápido y no hay timeouts.
        const MAX_IMAGE_SIZE = 2 * 1024 * 1024;

        const HEIC_TYPES = ['image/heic', 'image/heif', 'image/heic-sequence', 'image/heif-sequence'];
        const esHEIC = file =>
            HEIC_TYPES.includes((file.type || '').toLowerCase()) ||
            /\.heic$/i.test(file.name) ||
            /\.heif$/i.test(file.name);

        const readFileAsDataURL = file => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload  = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });

        const loadImage = src => new Promise((resolve, reject) => {
            const img = new Image();
            img.onload  = () => resolve(img);
            img.onerror = reject;
            img.src = src;
        });

        const canvasToBlob = (canvas, type, quality) => new Promise((resolve, reject) => {
            canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob falló')), type, quality);
        });

        // Race: limita cualquier Promise a ms milisegundos
        const withTimeout = (promise, ms, msg) =>
            Promise.race([
                promise,
                new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms))
            ]);

        /**
         * Convierte HEIC → JPEG con tres estrategias en cascada.
         * Cada intento tiene un timeout explícito para que nunca se cuelgue.
         */
        const heicToJpeg = async file => {
            const outName = file.name.replace(/\.[^.]+$/, '.jpg');

            // Intento 1: createImageBitmap nativo (Chrome/Safari modernos)
            // Timeout de 6 s — en muchos Android NUNCA resuelve ni rechaza sin esto
            try {
                const dataUrl = await readFileAsDataURL(file);
                const blob0   = await fetch(dataUrl).then(r => r.blob());
                const bitmap  = await withTimeout(
                    createImageBitmap(blob0),
                    6000,
                    'createImageBitmap timeout'
                );
                const canvas = document.createElement('canvas');
                canvas.width  = bitmap.width;
                canvas.height = bitmap.height;
                canvas.getContext('2d').drawImage(bitmap, 0, 0);
                const outBlob = await canvasToBlob(canvas, 'image/jpeg', 0.88);
                return new File([outBlob], outName, { type: 'image/jpeg' });
            } catch (_) { /* timeout o no soportado → siguiente */ }

            // Intento 2: heic2any (JS puro, funciona en todos los navegadores)
            try {
                if (!window._heic2any) {
                    await withTimeout(
                        new Promise((res, rej) => {
                            const s = document.createElement('script');
                            s.src = 'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js';
                            s.onload = res; s.onerror = rej;
                            document.head.appendChild(s);
                        }),
                        15000, 'heic2any load timeout'
                    );
                    window._heic2any = window.heic2any;
                }
                const result = await withTimeout(
                    window._heic2any({ blob: file, toType: 'image/jpeg', quality: 0.88 }),
                    30000, 'heic2any convert timeout'
                );
                const outBlob = Array.isArray(result) ? result[0] : result;
                return new File([outBlob], outName, { type: 'image/jpeg' });
            } catch (_) { /* fallo → siguiente */ }

            // Intento 3: enviar tal cual y dejar que sharp en el servidor lo maneje
            // (Render tiene libheif compilado, así que esto funciona)
            return file;
        };

        /**
         * Comprime un archivo al target MAX_IMAGE_SIZE.
         * Convierte HEIC → JPEG antes de comprimir.
         * Tiene un límite de iteraciones para que NUNCA se cuelgue.
         */
        const procesarImagen = async file => {
            // 1. Convertir HEIC si es necesario
            let f = esHEIC(file) ? await heicToJpeg(file) : file;

            // 2. Si ya está dentro del target, listo
            if (!f.type.startsWith('image/') || f.size <= MAX_IMAGE_SIZE) return f;

            // 3. Comprimir con canvas hasta llegar al target o agotar intentos
            const dataUrl = await readFileAsDataURL(f);
            const img     = await loadImage(dataUrl);

            let quality    = 0.88;
            let scale      = 1;
            let blob       = null;
            let outputType = 'image/jpeg'; // siempre JPEG para máxima compatibilidad
            const MAX_ITER = 20;

            for (let iter = 0; iter < MAX_ITER; iter++) {
                const canvas = document.createElement('canvas');
                // Máximo 1600 px en el lado largo para mobile
                const maxDim = 1600;
                const ratio  = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
                canvas.width  = Math.max(1, Math.floor(img.naturalWidth  * ratio * scale));
                canvas.height = Math.max(1, Math.floor(img.naturalHeight * ratio * scale));
                canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                blob = await canvasToBlob(canvas, outputType, quality);

                if (blob.size <= MAX_IMAGE_SIZE) break;

                if (quality > 0.30) { quality = Math.max(0.30, quality - 0.12); continue; }
                if (scale  > 0.40)  { scale  *= 0.80;                           continue; }
                break; // no se puede comprimir más — mandamos lo que tenemos
            }

            const outName = f.name.replace(/\.[^.]+$/, '.jpg');
            return new File([blob], outName, { type: outputType });
        };

        // ── Caché de fotos ya procesadas (se llenan al seleccionar, no al enviar) ──
        let fotosListas = []; // Array de File ya comprimidos/convertidos

        // 6. FOTOS — procesa las imágenes en el momento de la selección
        inputFotos.addEventListener('change', async function () {
            const previewContenedor = document.getElementById('previewFotos');
            const nombreCliente = clienteSel.options[clienteSel.selectedIndex]?.textContent || '';
            const maxFotos = (nombreCliente.toUpperCase().includes('AGD') ||
                              nombreCliente.toUpperCase().includes('DEL VALLE')) ? 5 : 3;

            // Reset
            fotosListas = [];
            previewContenedor.innerHTML = '';

            if (this.files.length === 0) {
                labelFotos.textContent = `Seleccionar fotos (máx. ${maxFotos})`;
                return;
            }

            if (this.files.length > maxFotos) {
                this.value = '';
                labelFotos.textContent = `Seleccionar fotos (máx. ${maxFotos})`;
                mostrarToastFotos(`Límite superado: solo se permiten ${maxFotos} fotos`);
                return;
            }

            const archivos = Array.from(this.files);
            const total    = archivos.length;
            labelFotos.textContent = `Procesando fotos…`;

            for (let i = 0; i < total; i++) {
                const file = archivos[i];
                labelFotos.textContent = `Procesando foto ${i + 1} de ${total}…`;

                // Placeholder mientras procesa
                const placeholder = document.createElement('div');
                placeholder.style.cssText =
                    'width:80px;height:80px;border-radius:8px;background:#222;display:flex;' +
                    'align-items:center;justify-content:center;font-size:22px;flex-shrink:0;';
                placeholder.textContent = '⏳';
                previewContenedor.appendChild(placeholder);

                let procesado;
                try {
                    procesado = await procesarImagen(file);
                } catch (err) {
                    mostrarToastError(`Error procesando "${file.name}": ${err.message}`);
                    this.value = '';
                    fotosListas = [];
                    previewContenedor.innerHTML = '';
                    labelFotos.textContent = `Seleccionar fotos (máx. ${maxFotos})`;
                    return;
                }

                fotosListas.push(procesado);

                // Reemplazar placeholder con preview real
                const url = URL.createObjectURL(procesado);
                const imgEl = document.createElement('img');
                imgEl.src       = url;
                imgEl.className = 'preview-img';
                imgEl.onload    = () => URL.revokeObjectURL(url);
                previewContenedor.replaceChild(imgEl, placeholder);
            }

            labelFotos.textContent = total === maxFotos
                ? `${total} de ${maxFotos} fotos — límite alcanzado`
                : `${total} de ${maxFotos} foto${total > 1 ? 's' : ''} seleccionada${total > 1 ? 's' : ''}`;

            if (total === maxFotos) {
                mostrarToastFotos(`${maxFotos} de ${maxFotos} fotos cargadas — límite alcanzado`);
            } else {
                mostrarToastFotos(`${total} foto${total > 1 ? 's' : ''} lista${total > 1 ? 's' : ''} para enviar`);
            }
        });

        // 7. SUBMIT
        document.getElementById('visitaForm').addEventListener('submit', async e => {
            e.preventDefault();

            if (!clienteSel.value)  { mostrarToastError('Seleccioná un cliente.');   return; }
            if (!sucursalSel.value) { mostrarToastError('Seleccioná una sucursal.'); return; }

            if (fotosListas.length === 0) {
                mostrarToastError('Cargá al menos una foto.');
                return;
            }

            // Validar que todas las categorías de stock estén seleccionadas (solo Del Valle)
            // Las claves gondola_* se excluyen del conteo porque se auto-asignan al renderizar
            const stockNormalKeys = Object.keys(stockSeleccionado).filter(k => !k.startsWith('gondola_'));
            if (totalCategorias > 0 && stockNormalKeys.length < totalCategorias) {
                const faltantes = totalCategorias - stockNormalKeys.length;
                mostrarToastError(`Completá el stock de todas las categorías. Faltan ${faltantes}.`);
                return;
            }

            if (!idRepo) { mostrarToastError('Sesión expirada.'); return; }

            // Deshabilitar botón para evitar doble envío
            const btnSubmit = document.querySelector('.btn-registrar');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin icono-btn"></i>Enviando…';

            const formData = new FormData();
            formData.append('id_repo',    idRepo);
            formData.append('id_cliente', clienteSel.value);
            formData.append('id_sucursal', sucursalSel.value);
            formData.append('productos',  JSON.stringify([]));
            formData.append('stock',      JSON.stringify(stockSeleccionado));

            for (const foto of fotosListas) {
                formData.append('imagenes', foto);
            }

            try {
                const res  = await fetch('/api/cargar-visita', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    mostrarToast();
                    setTimeout(() => { window.location.href = 'inicioRepositor.html'; }, 1600);
                } else {
                    mostrarToastError('Error: ' + (data.error || data.message));
                    btnSubmit.disabled = false;
                    btnSubmit.innerHTML = '<i class="fas fa-paper-plane icono-btn"></i>Registrar Visita';
                }
            } catch {
                mostrarToastError('Error de conexión con el servidor.');
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<i class="fas fa-paper-plane icono-btn"></i>Registrar Visita';
            }
        });

        // ── TOAST ÉXITO ──
        function mostrarToast() {
            const toast = document.getElementById('toast-exito');
            toast.classList.add('activo');
            setTimeout(() => toast.classList.remove('activo'), 1400);
        }

        // ── TOAST FOTOS ──
        function mostrarToastFotos(mensaje) {
            const toast = document.getElementById('toast-fotos');
            document.getElementById('toast-fotos-texto').textContent = mensaje;
            toast.classList.add('activo');
            setTimeout(() => toast.classList.remove('activo'), 2500);
        }

        // ── TOAST ERROR ──
        function mostrarToastError(mensaje) {
            const toast = document.getElementById('toast-error');
            document.getElementById('toast-error-texto').textContent = mensaje;
            toast.classList.add('activo');
            setTimeout(() => toast.classList.remove('activo'), 3500);
        }
    </script>

</body>

</html>
